plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

def minecraftVersion = providers.gradleProperty('minecraftVersion').orElse('1.20.5').get()
def fabricLoaderVersion = providers.gradleProperty('fabricLoaderVersion').orElse('0.18.6').get()
def fabricApiVersion = providers.gradleProperty('fabricApiVersion').orElse('0.97.6+1.20.5').get()
def javaVersion = providers.gradleProperty('javaVersion').orElse('21').get()

sourceSets {
    main {
        java.srcDir rootProject.file('fabric/src/main/java')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation project(':common')
    include project(':common')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'fabricLoaderVersion', fabricLoaderVersion
    inputs.property 'fabricApiVersion', fabricApiVersion
    inputs.property 'javaVersion', javaVersion

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraftVersion: minecraftVersion,
            fabricLoaderVersion: fabricLoaderVersion,
            fabricApiVersion: fabricApiVersion,
            javaVersion: javaVersion
        )
    }
}

tasks.jar {
    manifest {
        attributes(
            'Implementation-Title': 'ConfigStackMC Fabric Legacy',
            'Implementation-Version': project.version,
            'Minecraft-Version': minecraftVersion,
            'Fabric-Loader-Version': fabricLoaderVersion,
            'Fabric-API-Version': fabricApiVersion
        )
    }
}
